  <text x="420" y="399" font-family="Courier New" font-size="9" fill="#64748b">implements PlatformDownloadService</text>
  <rect x="410" y="420" width="280" height="36" rx="4" fill="rgba(168,85,247,0.08)" stroke="#a855f7" stroke-width="0.5"/>
  <text x="420" y="435" font-family="Courier New" font-size="11" fill="#e2e8f0">OhosPlatformChannel</text>
  <text x="420" y="449" font-family="Courier New" font-size="9" fill="#64748b">MethodChannel + EventChannel</text>
  <rect x="410" y="470" width="280" height="36" rx="4" fill="rgba(168,85,247,0.08)" stroke="#a855f7" stroke-width="0.5"/>
  <text x="420" y="485" font-family="Courier New" font-size="11" fill="#e2e8f0">ArkTS Native Bridge</text>
  <text x="420" y="499" font-family="Courier New" font-size="9" fill="#64748b">HarmonyOS system APIs</text>

  <rect x="740" y="320" width="320" height="200" rx="8" fill="rgba(96,165,250,0.05)" stroke="#60a5fa" stroke-width="1"/>
  <text x="900" y="340" text-anchor="middle" font-family="Courier New" font-size="12" font-weight="bold" fill="#60a5fa">DESKTOP PATH</text>
  <text x="900" y="356" text-anchor="middle" font-family="Courier New" font-size="10" fill="#94a3b8">supportsBackgroundDownloader = false</text>
  <rect x="760" y="370" width="280" height="36" rx="4" fill="rgba(96,165,250,0.08)" stroke="#60a5fa" stroke-width="0.5"/>
  <text x="770" y="385" font-family="Courier New" font-size="11" fill="#e2e8f0">FilePicker</text>
  <text x="770" y="399" font-family="Courier New" font-size="9" fill="#64748b">system file dialog</text>
  <rect x="760" y="420" width="280" height="36" rx="4" fill="rgba(96,165,250,0.08)" stroke="#60a5fa" stroke-width="0.5"/>
  <text x="770" y="435" font-family="Courier New" font-size="11" fill="#e2e8f0">path_provider</text>
  <text x="770" y="449" font-family="Courier New" font-size="9" fill="#64748b">app documents dir</text>
  <rect x="760" y="470" width="280" height="36" rx="4" fill="rgba(96,165,250,0.08)" stroke="#60a5fa" stroke-width="0.5"/>
  <text x="770" y="485" font-family="Courier New" font-size="11" fill="#e2e8f0">Process.run()</text>
  <text x="770" y="499" font-family="Courier New" font-size="9" fill="#64748b">native file open</text>

  <line x1="400" y1="270" x2="200" y2="320" stroke="#00ff88" stroke-width="1.5" marker-end="url(#arrow-g)"/>
  <line x1="550" y1="270" x2="550" y2="320" stroke="#a855f7" stroke-width="1.5"/>
  <line x1="700" y1="270" x2="900" y2="320" stroke="#60a5fa" stroke-width="1.5"/>

