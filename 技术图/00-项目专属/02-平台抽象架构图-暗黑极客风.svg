  <text x="200" y="340" text-anchor="middle" font-family="Courier New" font-size="12" font-weight="bold" fill="#00ff88">ANDROID PATH</text>
  <text x="200" y="356" text-anchor="middle" font-family="Courier New" font-size="10" fill="#94a3b8">supportsBackgroundDownloader = true</text>
  <rect x="60" y="370" width="280" height="36" rx="4" fill="rgba(0,255,136,0.08)" stroke="#00ff88" stroke-width="0.5"/>
  <text x="70" y="385" font-family="Courier New" font-size="11" fill="#e2e8f0">TransferManager</text>
  <text x="70" y="399" font-family="Courier New" font-size="9" fill="#64748b">Singleton · ChangeNotifier</text>
  <rect x="60" y="420" width="280" height="36" rx="4" fill="rgba(0,255,136,0.08)" stroke="#00ff88" stroke-width="0.5"/>
  <text x="70" y="435" font-family="Courier New" font-size="11" fill="#e2e8f0">flutter_downloader</text>
  <text x="70" y="449" font-family="Courier New" font-size="9" fill="#64748b">SQLite task persistence</text>
  <rect x="60" y="470" width="280" height="36" rx="4" fill="rgba(0,255,136,0.08)" stroke="#00ff88" stroke-width="0.5"/>
  <text x="70" y="485" font-family="Courier New" font-size="11" fill="#e2e8f0">MethodChannel</text>
  <text x="70" y="499" font-family="Courier New" font-size="9" fill="#64748b">Native Android bridge</text>

  <rect x="390" y="320" width="320" height="200" rx="8" fill="rgba(168,85,247,0.05)" stroke="#a855f7" stroke-width="1"/>
  <text x="550" y="340" text-anchor="middle" font-family="Courier New" font-size="12" font-weight="bold" fill="#a855f7">HARMONYOS (OHOS) PATH</text>
  <text x="550" y="356" text-anchor="middle" font-family="Courier New" font-size="10" fill="#94a3b8">supportsNativeDownloader = true</text>
  <rect x="410" y="370" width="280" height="36" rx="4" fill="rgba(168,85,247,0.08)" stroke="#a855f7" stroke-width="0.5"/>
