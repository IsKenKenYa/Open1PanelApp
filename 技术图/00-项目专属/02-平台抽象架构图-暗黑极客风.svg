  <rect x="60" y="585" width="180" height="40" rx="4" fill="rgba(255,68,68,0.08)" stroke="#ff4444" stroke-width="0.5"/>
  <text x="150" y="610" text-anchor="middle" font-family="Courier New" font-size="11" fill="#e2e8f0">Android (Kotlin/Java)</text>
  <rect x="260" y="585" width="180" height="40" rx="4" fill="rgba(255,68,68,0.08)" stroke="#ff4444" stroke-width="0.5"/>
  <text x="350" y="610" text-anchor="middle" font-family="Courier New" font-size="11" fill="#e2e8f0">HarmonyOS (ArkTS)</text>
  <rect x="460" y="585" width="180" height="40" rx="4" fill="rgba(255,68,68,0.08)" stroke="#ff4444" stroke-width="0.5"/>
  <text x="550" y="610" text-anchor="middle" font-family="Courier New" font-size="11" fill="#e2e8f0">macOS (Swift)</text>
  <rect x="660" y="585" width="180" height="40" rx="4" fill="rgba(255,68,68,0.08)" stroke="#ff4444" stroke-width="0.5"/>
  <text x="750" y="610" text-anchor="middle" font-family="Courier New" font-size="11" fill="#e2e8f0">Windows (C#)</text>
  <rect x="860" y="585" width="180" height="40" rx="4" fill="rgba(255,68,68,0.08)" stroke="#ff4444" stroke-width="0.5"/>
  <text x="950" y="610" text-anchor="middle" font-family="Courier New" font-size="11" fill="#e2e8f0">Linux (C/C++)</text>

  <rect x="100" y="680" width="900" height="50" rx="6" fill="rgba(255,149,0,0.08)" stroke="#ff9500" stroke-width="1"/>
  <text x="550" y="700" text-anchor="middle" font-family="Courier New" font-size="12" fill="#ff9500" font-weight="bold">CONSTRAINT: Native layer only provides platform capabilities — NO business logic duplication</text>
  <text x="550" y="718" text-anchor="middle" font-family="Courier New" font-size="10" fill="#94a3b8">All platforms share the same Dart State/Service/Repository/API layer. Platform differences are hidden behind Facades.</text>

  <rect x="850" y="75" width="200" height="80" rx="6" fill="rgba(255,255,255,0.05)" stroke="#1e3a5f"/>
  <text x="860" y="92" font-family="Courier New" font-size="10" font-weight="bold" fill="#e2e8f0">Legend</text>
