  <text x="525" y="152" text-anchor="middle" font-family="Courier New" font-size="8" fill="#64748b">lib/core/platform/services/</text>
  <rect x="630" y="110" width="170" height="60" rx="6" fill="rgba(0,212,255,0.1)" stroke="#00d4ff" stroke-width="1" filter="url(#glow)"/>
