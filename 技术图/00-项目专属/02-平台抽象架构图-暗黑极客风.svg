  <text x="60" y="95" font-family="Courier New" font-size="12" font-weight="bold" fill="#00d4ff">DART BUSINESS CORE (shared across all platforms)</text>
  <rect x="60" y="110" width="170" height="60" rx="6" fill="rgba(0,212,255,0.1)" stroke="#00d4ff" stroke-width="1" filter="url(#glow)"/>
  <text x="145" y="135" text-anchor="middle" font-family="Courier New" font-size="11" fill="#e2e8f0" font-weight="bold">TransferManagerProvider</text>
  <text x="145" y="152" text-anchor="middle" font-family="Courier New" font-size="8" fill="#64748b">lib/features/files/providers/</text>
