  <rect width="1100" height="800" fill="#0f0f1a" rx="8"/>
  <text x="550" y="36" text-anchor="middle" font-family="Courier New" font-size="18" font-weight="bold" fill="#00d4ff">1Panel Client — Platform Abstraction Architecture</text>
  <text x="550" y="54" text-anchor="middle" font-family="Courier New" font-size="11" fill="#64748b">Facade Pattern: Dart Business Core → Platform Services → Native Bridge</text>

