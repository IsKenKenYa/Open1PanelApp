<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1Panel Client - 导航壳</title>

<!-- Tailwind 4.x -->
<script src="https://cdn.jsdelivr.net/npm/tailwindcss@4"></script>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<style>
/* ===== Windows Fluent Design Tokens ===== */
:root {
  /* Brand */
  --op1-brand: #0C9B4B;
  --op1-brand-hover: #0A8540;
  --op1-brand-pressed: #087036;

  /* Semantic Colors */
  --op1-success: #0C9B4B;
  --op1-warning: #9B6F0C;
  --op1-danger: #C42B1C;
  --op1-info: #0078D4;

  /* Acrylic */
  --op1-acrylic-blur: 30px;
  --op1-acrylic-noise-opacity: 0.03;
  --op1-acrylic-tint-opacity: 0.80;

  /* Mica */
  --op1-mica-opacity: 0.85;
  --op1-mica-blur: 60px;

  /* Reveal */
  --op1-reveal-hover: rgba(255, 255, 255, 0.08);
  --op1-reveal-pressed: rgba(255, 255, 255, 0.04);
  --reveal-x: 50%;
  --reveal-y: 50%;

  /* Surface - Light */
  --op1-surface: #F3F3F3;
  --op1-surface-card: #FFFFFF;
  --op1-surface-nav: rgba(243, 243, 243, 0.80);
  --op1-surface-container-low: #F9F9F9;
  --op1-surface-container: #F3F3F3;
  --op1-surface-container-high: #EDEDED;

  /* On-Surface - Light */
  --op1-on-surface: #1A1A1A;
  --op1-on-surface-variant: #616161;

  /* Navigation */
  --op1-nav-pane-expanded: 320px;
  --op1-nav-pane-compact: 48px;
  --op1-nav-top-height: 48px;

  /* Font */
  --op1-font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
  --op1-font-family-mono: 'Cascadia Code', 'Consolas', monospace;

  /* Radius */
  --op1-radius-sm: 4px;
  --op1-radius-md: 8px;
  --op1-radius-lg: 8px;
  --op1-radius-card: 8px;
  --op1-radius-full: 9999px;

  /* Motion */
  --op1-motion-fast: 167ms;
  --op1-motion-normal: 250ms;
  --op1-motion-easing-decelerate: cubic-bezier(0, 0, 0, 1);
  --op1-motion-easing-standard: cubic-bezier(0.8, 0, 0.2, 1);

  /* Border */
  --op1-border: #E5E5E5;
  --op1-card-stroke: #E5E5E5;

  /* Error */
  --op1-error: #C42B1C;

  /* Divider */
  --op1-divider: #E5E5E5;
}

/* Dark theme tokens */
html.dark {
  --op1-surface: #202020;
  --op1-surface-card: #2D2D2D;
  --op1-surface-nav: rgba(32, 32, 32, 0.80);
  --op1-surface-container-low: #2A2A2A;
  --op1-surface-container: #202020;
  --op1-surface-container-high: #1A1A1A;
  --op1-on-surface: #FFFFFF;
  --op1-on-surface-variant: #A0A0A0;
  --op1-border: #3D3D3D;
  --op1-card-stroke: #3D3D3D;
  --op1-divider: #3D3D3D;
  --op1-reveal-hover: rgba(255, 255, 255, 0.06);
  --op1-reveal-pressed: rgba(255, 255, 255, 0.03);
  --op1-acrylic-tint-opacity: 0.60;
  --op1-mica-opacity: 0.80;
}

/* ===== Base ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: var(--op1-font-family);
  color: var(--op1-on-surface);
  background: var(--op1-surface);
  overflow: hidden;
  height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ===== Acrylic noise texture ===== */
.op1-acrylic {
  position: relative;
}
.op1-acrylic::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
  opacity: var(--op1-acrylic-noise-opacity);
  pointer-events: none;
  border-radius: inherit;
  z-index: 1;
}

/* ===== NavigationView Layout ===== */
.nav-view {
  display: flex;
  height: 100vh;
  width: 100vw;
}

/* ===== Navigation Pane - Expanded ===== */
.nav-pane {
  width: var(--op1-nav-pane-expanded);
  min-width: var(--op1-nav-pane-expanded);
  height: 100vh;
  display: flex;
  flex-direction: column;
  background: rgba(243, 243, 243, 0.85);
  backdrop-filter: blur(60px);
  -webkit-backdrop-filter: blur(60px);
  border-right: 1px solid var(--op1-border);
  transition: width var(--op1-motion-normal) var(--op1-motion-easing-standard),
              min-width var(--op1-motion-normal) var(--op1-motion-easing-standard);
  overflow: hidden;
  z-index: 10;
}
html.dark .nav-pane {
  background: var(--op1-surface-nav);
}

/* ===== Navigation Pane - Compact ===== */
@media (max-width: 1279px) and (min-width: 768px),
       (max-width: 767px) {
  .nav-pane {
    width: var(--op1-nav-pane-compact);
    min-width: var(--op1-nav-pane-compact);
  }
  .nav-pane .nav-label,
  .nav-pane .nav-search-wrap,
  .nav-pane .nav-footer-info,
  .nav-pane .nav-footer-server-name {
    display: none;
  }
  .nav-pane .nav-search {
    display: none;
  }
  .nav-pane .nav-item {
    justify-content: center;
    padding: 12px 0;
  }
  .nav-pane .nav-header {
    justify-content: center;
    padding: 12px 0;
  }
  .nav-pane .nav-header-title {
    display: none;
  }
  .nav-pane .nav-footer {
    justify-content: center;
    padding: 12px 0;
  }
}

/* Nav Header */
.nav-header {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px 16px 12px 16px;
  height: auto;
  flex-shrink: 0;
}

.nav-header-brand {
  color: var(--op1-brand);
}

.nav-header-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--op1-on-surface);
  white-space: nowrap;
}

/* Nav Search */
.nav-search-wrap {
  padding: 0 16px 12px 16px;
  flex-shrink: 0;
}

.nav-search {
  position: relative;
}
.nav-search input {
  width: 100%;
  height: 36px;
  padding: 0 12px 0 36px;
  font-size: 13px;
  font-family: var(--op1-font-family);
  color: var(--op1-on-surface);
  background: var(--op1-surface-container-low);
  border: none;
  border-bottom: 1px solid var(--op1-border);
  border-radius: var(--op1-radius-sm);
  outline: none;
  transition: border-color var(--op1-motion-fast) var(--op1-motion-easing-standard),
              background var(--op1-motion-fast) var(--op1-motion-easing-standard);
}
html.dark .nav-search input {
  background: rgba(255, 255, 255, 0.06);
  border-bottom-color: var(--op1-border);
}
.nav-search input::placeholder {
  color: var(--op1-on-surface-variant);
}
.nav-search input:focus {
  border-bottom: 2px solid var(--op1-brand);
  background: var(--op1-surface-card);
}
.nav-search .search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--op1-on-surface-variant);
  pointer-events: none;
}

/* Nav Items Container */
.nav-items {
  flex: 1;
  overflow-y: auto;
  padding: 4px 8px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  border-radius: var(--op1-radius-sm);
  cursor: pointer;
  font-size: 14px;
  color: var(--op1-on-surface);
  position: relative;
  user-select: none;
  white-space: nowrap;
  transition: background var(--op1-motion-fast) var(--op1-motion-easing-standard);
  border-left: 3px solid transparent;
}
.nav-item:hover {
  background: radial-gradient(circle at var(--reveal-x) var(--reveal-y), var(--op1-reveal-hover), transparent 70%);
}
.nav-item:active {
  background: var(--op1-reveal-pressed);
}
.nav-item .nav-icon {
  flex-shrink: 0;
  color: var(--op1-on-surface);
}

/* Selected state */
.nav-item.active {
  border-left-color: var(--op1-brand);
  background: rgba(12, 155, 75, 0.08);
  color: var(--op1-brand);
  font-weight: 600;
}
.nav-item.active .nav-icon {
  color: var(--op1-brand);
}
html.dark .nav-item.active {
  background: rgba(12, 155, 75, 0.15);
}

/* Compact mode tooltip */
@media (max-width: 1279px) and (min-width: 768px),
       (max-width: 767px) {
  .nav-item {
    position: relative;
  }
  .nav-item .nav-tooltip {
    display: none;
    position: absolute;
    left: calc(100% + 8px);
    top: 50%;
    transform: translateY(-50%);
    background: var(--op1-surface-card);
    color: var(--op1-on-surface);
    padding: 6px 12px;
    border-radius: var(--op1-radius-sm);
    font-size: 13px;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
    border: 1px solid var(--op1-border);
    z-index: 100;
    pointer-events: none;
  }
  .nav-item:hover .nav-tooltip {
    display: block;
  }
}

/* Nav Footer */
.nav-footer {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  border-top: 1px solid var(--op1-divider);
  flex-shrink: 0;
}

.nav-footer-info {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}

.nav-footer-server-name {
  font-size: 13px;
  color: var(--op1-on-surface);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.nav-footer-online-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--op1-success);
  flex-shrink: 0;
}

.nav-footer-settings-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: var(--op1-radius-sm);
  cursor: pointer;
  color: var(--op1-on-surface-variant);
  transition: background var(--op1-motion-fast) var(--op1-motion-easing-standard);
  flex-shrink: 0;
}
.nav-footer-settings-btn:hover {
  background: radial-gradient(circle at var(--reveal-x) var(--reveal-y), var(--op1-reveal-hover), transparent 70%);
}

/* ===== Content Area ===== */
.nav-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  background: var(--op1-surface);
  overflow: hidden;
}

/* CommandBar */
.command-bar {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 8px 16px;
  height: var(--op1-nav-top-height);
  background: var(--op1-surface);
  border-bottom: 1px solid var(--op1-border);
  flex-shrink: 0;
}
html.dark .command-bar {
  background: var(--op1-surface);
}

.command-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  height: 32px;
  font-size: 13px;
  font-family: var(--op1-font-family);
  color: var(--op1-on-surface);
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--op1-radius-sm);
  cursor: pointer;
  white-space: nowrap;
  position: relative;
  overflow: hidden;
  transition: background var(--op1-motion-fast) var(--op1-motion-easing-standard),
              border-color var(--op1-motion-fast) var(--op1-motion-easing-standard);
}
.command-btn:hover {
  background: radial-gradient(circle at var(--reveal-x) var(--reveal-y), var(--op1-reveal-hover), transparent 70%);
  border-color: var(--op1-border);
}
.command-btn:active {
  background: var(--op1-reveal-pressed);
  border-color: var(--op1-border);
}

.command-btn-label {
  display: inline;
}

/* Separator in command bar */
.command-separator {
  width: 1px;
  height: 24px;
  background: var(--op1-divider);
  margin: 0 4px;
}

/* Content Body */
.content-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

/* Dashboard Preview Cards */
.dash-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}

.dash-card {
  background: var(--op1-surface-card);
  border: 1px solid var(--op1-card-stroke);
  border-radius: var(--op1-radius-card);
  padding: 20px;
  position: relative;
  overflow: hidden;
  transition: box-shadow var(--op1-motion-fast) var(--op1-motion-easing-standard);
}
.dash-card:hover {
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
}
html.dark .dash-card:hover {
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.20);
}

.dash-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.dash-card-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--op1-on-surface);
}

.dash-card-icon {
  color: var(--op1-on-surface-variant);
}

.dash-card-value {
  font-size: 28px;
  font-weight: 700;
  color: var(--op1-on-surface);
  margin-bottom: 4px;
}

.dash-card-subtitle {
  font-size: 12px;
  color: var(--op1-on-surface-variant);
}

.dash-card-accent {
  height: 3px;
  border-radius: var(--op1-radius-full);
  margin-top: 16px;
  background: var(--op1-brand);
  opacity: 0.5;
}

/* Status bar chip */
.status-chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--op1-radius-full);
  font-size: 11px;
  font-weight: 600;
}
.status-chip-success {
  background: rgba(12, 155, 75, 0.12);
  color: var(--op1-success);
}
.status-chip-warning {
  background: rgba(155, 111, 12, 0.12);
  color: var(--op1-warning);
}

/* ===== Compact: CommandBar labels hide ===== */
@media (max-width: 1279px) and (min-width: 768px),
       (max-width: 767px) {
  .command-btn-label {
    display: none;
  }
  .command-btn {
    padding: 6px;
    width: 32px;
    justify-content: center;
  }
}

/* Scrollbar Fluent style */
::-webkit-scrollbar {
  width: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--op1-on-surface-variant);
  border-radius: 3px;
  opacity: 0.5;
}
::-webkit-scrollbar-thumb:hover {
  background: var(--op1-on-surface);
}

/* ===== Theme toggle button ===== */
.theme-toggle-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: var(--op1-radius-sm);
  cursor: pointer;
  color: var(--op1-on-surface-variant);
  background: transparent;
  border: none;
  transition: background var(--op1-motion-fast) var(--op1-motion-easing-standard);
  flex-shrink: 0;
}
.theme-toggle-btn:hover {
  background: radial-gradient(circle at var(--reveal-x) var(--reveal-y), var(--op1-reveal-hover), transparent 70%);
}

html.dark .icon-sun { display: block; }
html.dark .icon-moon { display: none; }
html.light .icon-sun { display: none; }
html.light .icon-moon { display: block; }
</style>
</head>

<body>
<div class="nav-view">

  <!-- ===== Navigation Pane ===== -->
  <nav class="nav-pane op1-acrylic" id="navPane">

    <!-- Header: Brand + Search -->
    <div class="nav-header">
      <div class="nav-header-brand">
        <i data-lucide="server" style="width:20px;height:20px;"></i>
      </div>
      <span class="nav-header-title">1Panel</span>
    </div>

    <div class="nav-search-wrap">
      <div class="nav-search">
        <i data-lucide="search" class="search-icon" style="width:14px;height:14px;"></i>
        <input type="text" placeholder="搜索模块..." id="navSearchInput">
      </div>
    </div>

    <!-- Menu Items -->
    <div class="nav-items" id="navItems">
      <div class="nav-item active" data-reveal data-nav="dashboard">
        <i data-lucide="layout-dashboard" class="nav-icon" style="width:20px;height:20px;"></i>
        <span class="nav-label">仪表板</span>
        <span class="nav-tooltip">仪表板</span>
      </div>
      <div class="nav-item" data-reveal data-nav="containers">
        <i data-lucide="box" class="nav-icon" style="width:20px;height:20px;"></i>
        <span class="nav-label">容器</span>
        <span class="nav-tooltip">容器</span>
      </div>
      <div class="nav-item" data-reveal data-nav="files">
        <i data-lucide="folder-open" class="nav-icon" style="width:20px;height:20px;"></i>
        <span class="nav-label">文件</span>
        <span class="nav-tooltip">文件</span>
      </div>
      <div class="nav-item" data-reveal data-nav="websites">
        <i data-lucide="globe" class="nav-icon" style="width:20px;height:20px;"></i>
        <span class="nav-label">网站</span>
        <span class="nav-tooltip">网站</span>
      </div>
      <div class="nav-item" data-reveal data-nav="settings">
        <i data-lucide="settings" class="nav-icon" style="width:20px;height:20px;"></i>
        <span class="nav-label">设置</span>
        <span class="nav-tooltip">设置</span>
      </div>
    </div>

    <!-- Footer: Server Switch + Settings -->
    <div class="nav-footer">
      <div class="nav-footer-info">
        <span class="nav-footer-online-dot"></span>
        <span class="nav-footer-server-name">生产服务器</span>
      </div>
      <button class="theme-toggle-btn" id="themeToggleBtn" title="切换主题">
        <i data-lucide="sun" class="icon-sun" style="width:16px;height:16px;"></i>
        <i data-lucide="moon" class="icon-moon" style="width:16px;height:16px;"></i>
      </button>
      <div class="nav-footer-settings-btn" data-reveal title="设置">
        <i data-lucide="settings" style="width:16px;height:16px;"></i>
      </div>
    </div>
  </nav>

  <!-- ===== Content Area ===== -->
  <div class="nav-content">

    <!-- CommandBar -->
    <div class="command-bar">
      <button class="command-btn" data-reveal title="新建">
        <i data-lucide="plus" style="width:16px;height:16px;"></i>
        <span class="command-btn-label">新建</span>
      </button>
      <button class="command-btn" data-reveal title="刷新">
        <i data-lucide="refresh-cw" style="width:16px;height:16px;"></i>
        <span class="command-btn-label">刷新</span>
      </button>
      <div class="command-separator"></div>
      <button class="command-btn" data-reveal title="设置">
        <i data-lucide="settings" style="width:16px;height:16px;"></i>
        <span class="command-btn-label">设置</span>
      </button>
    </div>

    <!-- Dashboard Content -->
    <div class="content-body">
      <div class="dash-grid">

        <!-- Card: CPU -->
        <div class="dash-card">
          <div class="dash-card-header">
            <span class="dash-card-title">CPU 使用率</span>
            <i data-lucide="cpu" class="dash-card-icon" style="width:18px;height:18px;"></i>
          </div>
          <div class="dash-card-value">23%</div>
          <div class="dash-card-subtitle">4 核 / Intel Xeon E5-2680</div>
          <div class="dash-card-accent" style="background:var(--op1-success);"></div>
        </div>

        <!-- Card: Memory -->
        <div class="dash-card">
          <div class="dash-card-header">
            <span class="dash-card-title">内存使用</span>
            <i data-lucide="memory-stick" class="dash-card-icon" style="width:18px;height:18px;"></i>
          </div>
          <div class="dash-card-value">6.2 GB</div>
          <div class="dash-card-subtitle">已用 / 共 16 GB (38.8%)</div>
          <div class="dash-card-accent" style="background:var(--op1-info);"></div>
        </div>

        <!-- Card: Disk -->
        <div class="dash-card">
          <div class="dash-card-header">
            <span class="dash-card-title">磁盘使用</span>
            <i data-lucide="hard-drive" class="dash-card-icon" style="width:18px;height:18px;"></i>
          </div>
          <div class="dash-card-value">128 GB</div>
          <div class="dash-card-subtitle">已用 / 共 500 GB (25.6%)</div>
          <div class="dash-card-accent" style="background:var(--op1-brand);"></div>
        </div>

        <!-- Card: Containers -->
        <div class="dash-card">
          <div class="dash-card-header">
            <span class="dash-card-title">运行容器</span>
            <i data-lucide="box" class="dash-card-icon" style="width:18px;height:18px;"></i>
          </div>
          <div class="dash-card-value">12</div>
          <div class="dash-card-subtitle">
            <span class="status-chip status-chip-success">12 运行中</span>
            <span class="status-chip status-chip-warning" style="margin-left:4px;">2 已停止</span>
          </div>
          <div class="dash-card-accent" style="background:var(--op1-warning);"></div>
        </div>

        <!-- Card: Network -->
        <div class="dash-card">
          <div class="dash-card-header">
            <span class="dash-card-title">网络流量</span>
            <i data-lucide="network" class="dash-card-icon" style="width:18px;height:18px;"></i>
          </div>
          <div class="dash-card-value">1.8 Mbps</div>
          <div class="dash-card-subtitle">入站 1.2 Mbps / 出站 0.6 Mbps</div>
          <div class="dash-card-accent" style="background:var(--op1-info);"></div>
        </div>

        <!-- Card: System Uptime -->
        <div class="dash-card">
          <div class="dash-card-header">
            <span class="dash-card-title">系统运行时间</span>
            <i data-lucide="clock" class="dash-card-icon" style="width:18px;height:18px;"></i>
          </div>
          <div class="dash-card-value">42 天</div>
          <div class="dash-card-subtitle">自 2025-06-01 08:00 起</div>
          <div class="dash-card-accent" style="background:var(--op1-success);"></div>
        </div>

      </div>
    </div>
  </div>

</div>

<script>
  // ===== Initialize Lucide Icons =====
  lucide.createIcons();

  // ===== Reveal highlight hover effect =====
  document.querySelectorAll('[data-reveal]').forEach(el => {
    el.addEventListener('mousemove', e => {
      const rect = el.getBoundingClientRect();
      el.style.setProperty('--reveal-x', (e.clientX - rect.left) + 'px');
      el.style.setProperty('--reveal-y', (e.clientY - rect.top) + 'px');
    });
    el.addEventListener('mouseleave', () => {
      el.style.removeProperty('--reveal-x');
      el.style.removeProperty('--reveal-y');
    });
  });

  // ===== Navigation item selection =====
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
    });
  });

  // ===== Theme toggle =====
  function toggleTheme() {
    const html = document.documentElement;
    if (html.classList.contains('light')) {
      html.classList.remove('light');
      html.classList.add('dark');
    } else {
      html.classList.remove('dark');
      html.classList.add('light');
    }
  }

  document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);
</script>
</body>
</html>
