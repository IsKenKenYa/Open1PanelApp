<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1Panel Client - 连接服务器</title>
<script src="https://cdn.jsdelivr.net/npm/tailwindcss@4"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
:root {
  --op1-brand: #0C9B4B; --op1-brand-hover: #0A8540; --op1-brand-pressed: #087036;
  --op1-success: #0C9B4B; --op1-warning: #9B6F0C; --op1-danger: #C42B1C; --op1-info: #0078D4;
  --op1-reveal-hover: rgba(255,255,255,0.08); --op1-reveal-pressed: rgba(255,255,255,0.04);
  --reveal-x: 50%; --reveal-y: 50%;
  --op1-surface: #F3F3F3; --op1-surface-card: #FFFFFF;
  --op1-surface-container-low: #F9F9F9; --op1-surface-container-high: #EDEDED;
  --op1-on-surface: #1A1A1A; --op1-on-surface-variant: #616161;
  --op1-font-family: 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
  --op1-radius-sm: 4px; --op1-radius-card: 8px; --op1-radius-full: 9999px;
  --op1-motion-fast: 167ms; --op1-motion-normal: 250ms;
  --op1-motion-easing-standard: cubic-bezier(0.8,0,0.2,1);
  --op1-border: #E5E5E5; --op1-card-stroke: #E5E5E5; --op1-error: #C42B1C; --op1-divider: #E5E5E5;
}
html.dark {
  --op1-surface: #202020; --op1-surface-card: #2D2D2D;
  --op1-surface-container-low: #2A2A2A; --op1-surface-container-high: #1A1A1A;
  --op1-on-surface: #FFFFFF; --op1-on-surface-variant: #A0A0A0;
  --op1-border: #3D3D3D; --op1-card-stroke: #3D3D3D; --op1-divider: #3D3D3D;
  --op1-reveal-hover: rgba(255,255,255,0.06); --op1-reveal-pressed: rgba(255,255,255,0.03);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family:var(--op1-font-family); color:var(--op1-on-surface);
  height:100vh; width:100vw; overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* Mica background */
.login-bg {
  width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  position:relative;
}
html.light .login-bg {
  background: linear-gradient(135deg, #E8F5E9 0%, #F3F3F3 40%, #E3F2FD 100%);
}
html.dark .login-bg {
  background: linear-gradient(135deg, #1A2E1A 0%, #202020 40%, #1A1A2E 100%);
}

/* Mica noise overlay */
.login-bg::before {
  content:''; position:absolute; inset:0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events:none; z-index:0;
}

/* Login card */
.login-card {
  position:relative; z-index:1;
  width:420px; max-width:90vw;
  background:var(--op1-surface-card);
  border:1px solid var(--op1-card-stroke);
  border-radius:var(--op1-radius-card);
  padding:40px 36px 32px;
  box-shadow:0 8px 32px rgba(0,0,0,0.08);
}
html.dark .login-card { box-shadow:0 8px 32px rgba(0,0,0,0.30); }

/* Logo */
.login-logo {
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin-bottom:8px;
}
.login-logo-icon { color:var(--op1-brand); }
.login-logo-text {
  font-size:22px; font-weight:700; color:var(--op1-on-surface);
}
.login-subtitle {
  text-align:center; font-size:13px; color:var(--op1-on-surface-variant);
  margin-bottom:32px;
}

/* Form */
.form-group { margin-bottom:20px; }
.form-label {
  display:block; font-size:13px; font-weight:500; color:var(--op1-on-surface);
  margin-bottom:6px;
}
.form-input {
  width:100%; height:36px; padding:0 12px; font-size:14px;
  font-family:var(--op1-font-family); color:var(--op1-on-surface);
  background:var(--op1-surface-container-low);
  border:1px solid var(--op1-border);
  border-radius:var(--op1-radius-sm); outline:none;
  transition:border-color var(--op1-motion-fast) var(--op1-motion-easing-standard);
}
html.dark .form-input { background:rgba(255,255,255,0.05); }
.form-input::placeholder { color:var(--op1-on-surface-variant); }
.form-input:focus { border-color:var(--op1-brand); border-bottom-width:2px; }
.form-input-wrapper {
  position:relative;
}
.form-input-wrapper .input-icon {
  position:absolute; left:10px; top:50%; transform:translateY(-50%);
  color:var(--op1-on-surface-variant); pointer-events:none;
}
.form-input-wrapper .toggle-pw {
  position:absolute; right:8px; top:50%; transform:translateY(-50%);
  width:28px; height:28px; display:flex; align-items:center; justify-content:center;
  border-radius:var(--op1-radius-sm); cursor:pointer; color:var(--op1-on-surface-variant);
  border:none; background:transparent;
  transition:background var(--op1-motion-fast);
}
.form-input-wrapper .toggle-pw:hover { background:var(--op1-surface-container-high); }
.form-input-wrapper .form-input { padding-left:36px; }
.form-input-wrapper .form-input.pw-input { padding-right:40px; }

/* CheckBox */
.fluent-checkbox {
  display:flex; align-items:center; gap:10px; cursor:pointer;
  font-size:13px; color:var(--op1-on-surface); user-select:none;
  margin-bottom:24px;
}
.fluent-checkbox input { display:none; }
.fluent-checkbox-box {
  width:20px; height:20px; border:2px solid var(--op1-border);
  border-radius:var(--op1-radius-sm); display:flex; align-items:center; justify-content:center;
  transition:border-color var(--op1-motion-fast), background var(--op1-motion-fast);
  flex-shrink:0;
}
.fluent-checkbox input:checked + .fluent-checkbox-box {
  background:var(--op1-brand); border-color:var(--op1-brand);
}

/* AccentButton */
.accent-btn {
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; height:36px; font-size:14px; font-weight:600;
  font-family:var(--op1-font-family); color:#FFFFFF;
  background:var(--op1-brand); border:none;
  border-radius:var(--op1-radius-sm); cursor:pointer;
  transition:background var(--op1-motion-fast);
}
.accent-btn:hover { background:var(--op1-brand-hover); }
.accent-btn:active { background:var(--op1-brand-pressed); }
.accent-btn:disabled { opacity:0.5; cursor:not-allowed; }

/* Connection status */
.conn-status {
  margin-top:16px; display:flex; align-items:center; gap:8px;
  font-size:12px; color:var(--op1-on-surface-variant);
  min-height:20px;
}
.conn-status-dot {
  width:8px; height:8px; border-radius:50%; flex-shrink:0;
}
.conn-status-dot.idle { background:var(--op1-on-surface-variant); }
.conn-status-dot.testing { background:var(--op1-warning); animation:pulse 1s infinite; }
.conn-status-dot.success { background:var(--op1-success); }
.conn-status-dot.error { background:var(--op1-danger); }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

/* Theme toggle for login page */
.login-theme-toggle {
  position:fixed; top:16px; right:16px; z-index:10;
  width:36px; height:36px; border-radius:var(--op1-radius-sm);
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; color:var(--op1-on-surface-variant);
  background:var(--op1-surface-card); border:1px solid var(--op1-border);
  transition:background var(--op1-motion-fast);
}
.login-theme-toggle:hover { background:var(--op1-surface-container-high); }
html.dark .icon-sun{display:block;} html.dark .icon-moon{display:none;}
html.light .icon-sun{display:none;} html.light .icon-moon{display:block;}
</style>
</head>
<body>

<button class="login-theme-toggle" id="themeToggleBtn" title="切换主题">
  <i data-lucide="sun" class="icon-sun" style="width:16px;height:16px;"></i>
  <i data-lucide="moon" class="icon-moon" style="width:16px;height:16px;"></i>
</button>

<div class="login-bg">
  <div class="login-card">

    <!-- Logo & Title -->
    <div class="login-logo">
      <i data-lucide="server" class="login-logo-icon" style="width:28px;height:28px;"></i>
      <span class="login-logo-text">1Panel</span>
    </div>
    <div class="login-subtitle">Linux 服务器运维管理面板</div>

    <!-- Server Address -->
    <div class="form-group">
      <label class="form-label">服务器地址</label>
      <div class="form-input-wrapper">
        <i data-lucide="globe" class="input-icon" style="width:16px;height:16px;"></i>
        <input type="text" class="form-input" placeholder="https://your-server.com:8888" value="https://192.168.1.100:8888">
      </div>
    </div>

    <!-- API Key -->
    <div class="form-group">
      <label class="form-label">API 密钥</label>
      <div class="form-input-wrapper">
        <i data-lucide="key-round" class="input-icon" style="width:16px;height:16px;"></i>
        <input type="password" class="form-input pw-input" placeholder="输入 API Key" value="••••••••••••••••••••" id="apiKeyInput">
        <button class="toggle-pw" id="togglePw" title="显示/隐藏密码">
          <i data-lucide="eye-off" style="width:16px;height:16px;" id="pwIcon"></i>
        </button>
      </div>
    </div>

    <!-- Remember Password -->
    <label class="fluent-checkbox">
      <input type="checkbox" checked>
      <span class="fluent-checkbox-box">
        <i data-lucide="check" style="width:14px;height:14px;color:#FFFFFF;"></i>
      </span>
      记住密码
    </label>

    <!-- Connect Button -->
    <button class="accent-btn" id="connectBtn">
      <i data-lucide="plug" style="width:16px;height:16px;"></i>
      连接
    </button>

    <!-- Connection Status -->
    <div class="conn-status" id="connStatus">
      <span class="conn-status-dot idle" id="connDot"></span>
      <span id="connText">就绪，等待连接</span>
    </div>

  </div>
</div>

<script>
  lucide.createIcons();

  function toggleTheme() {
    const h = document.documentElement;
    if (h.classList.contains('light')) { h.classList.remove('light'); h.classList.add('dark'); }
    else { h.classList.remove('dark'); h.classList.add('light'); }
  }
  document.getElementById('themeToggleBtn').addEventListener('click', toggleTheme);

  // Password toggle
  document.getElementById('togglePw').addEventListener('click', () => {
    const input = document.getElementById('apiKeyInput');
    const icon = document.getElementById('pwIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.setAttribute('data-lucide', 'eye');
    } else {
      input.type = 'password';
      icon.setAttribute('data-lucide', 'eye-off');
    }
    lucide.createIcons();
  });

  // Simulate connection test
  document.getElementById('connectBtn').addEventListener('click', () => {
    const dot = document.getElementById('connDot');
    const text = document.getElementById('connText');
    const btn = document.getElementById('connectBtn');

    dot.className = 'conn-status-dot testing';
    text.textContent = '正在测试连接...';
    btn.disabled = true;

    setTimeout(() => {
      dot.className = 'conn-status-dot success';
      text.textContent = '连接成功，正在进入...';
      btn.disabled = false;
    }, 2000);
  });
</script>
</body>
</html>
