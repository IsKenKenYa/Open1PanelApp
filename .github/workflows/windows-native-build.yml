name: Windows Native Build

on:
  push:
    branches:
      - dev-v2
    paths:
      - "windows/**"
  pull_request:
    branches:
      - dev-v2
    paths:
      - "windows/**"

concurrency:
  group: windows-native-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows Native Host
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Windows App SDK
        run: dotnet workload install windowsdesktop

      - name: Build Native Host
        run: dotnet build windows/runner/native_host/OnePanelNativeHost/OnePanelNativeHost.csproj -c Debug
