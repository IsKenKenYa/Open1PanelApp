name: Flutter CI

on:
  push:
    branches:
      - dev-v2
  pull_request:
    branches:
      - dev-v2

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Flutter Analyze
        run: flutter analyze 2>&1 | tee analyze-output.txt

      - name: Analyze Summary
        if: always()
        run: |
          echo "## 🔍 Analyze Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          FLUTTER_VER=$(flutter --version | head -1)
          echo "**Flutter Version:** $FLUTTER_VER" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f analyze-output.txt ]; then
            ISSUES=$(grep -cE 'error|warning|info' analyze-output.txt || echo "0")
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Issues | $ISSUES |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat analyze-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: stable
          cache: true

      - name: Cache Pub
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Run Unit Tests
        run: |
          mkdir -p test-results
          MAX_RETRIES=2
          ATTEMPT=0
          while true; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "::group::Test attempt $ATTEMPT"
            flutter test test/features test/api test/core test/data test/auth test/config test/shared --no-pub > test-results/unit-test-output.txt 2>&1
            TEST_EXIT_CODE=$?
            cat test-results/unit-test-output.txt
            echo "::endgroup::"
            if [ $TEST_EXIT_CODE -eq 0 ]; then
              break
            fi
            if [ $ATTEMPT -le $MAX_RETRIES ] && grep -qE "Connection|SocketException|TimeoutException" test-results/unit-test-output.txt; then
              echo "::warning::Network-related failure detected, retrying ($ATTEMPT/$MAX_RETRIES)..."
              continue
            fi
            break
          done
          exit $TEST_EXIT_CODE

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: test-results/
          retention-days: 7

      - name: Test Summary
        if: always()
        run: |
          echo "## 🧪 Unit Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          FLUTTER_VER=$(flutter --version | head -1)
          echo "**Flutter Version:** $FLUTTER_VER" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f test-results/unit-test-output.txt ]; then
            PASSED=$(grep -oP '\d+(?= passed)' test-results/unit-test-output.txt | tail -1 || echo "N/A")
            FAILED=$(grep -oP '\d+(?= failed)' test-results/unit-test-output.txt | tail -1 || echo "0")
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -30 test-results/unit-test-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
